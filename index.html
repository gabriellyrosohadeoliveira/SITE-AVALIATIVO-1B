<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobos: Soberanos da Natureza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav aria-label="Navegação Principal">
            <div class="logo">WolfUX</div>
            <div class="controls">
                <button id="btn-contrast" aria-label="Alternar Alto Contraste">🌓</button>
                <button id="font-up" aria-label="Aumentar Fonte">A+</button>
                <button id="font-down" aria-label="Diminuir Fonte">A-</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <h1 id="hero-title">O Fascínio dos Lobos</h1>
            <p>Conheça a inteligência e a estrutura social dos predadores mais resilientes do planeta.</p>
        </section>

        <section id="especies" class="container" aria-labelledby="especies-title">
            <h2 id="especies-title">Espécies em Destaque</h2>
            <div id="grid-especies" class="grid-layout">
                </div>
        </section>

        <section class="container" aria-labelledby="comportamento-title">
            <h2 id="comportamento-title">Comportamento e Alcateia</h2>
            <div class="accordion" id="accordion-comportamento">
                </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2023 Projeto Lobos - Foco em UX e Acessibilidade.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
